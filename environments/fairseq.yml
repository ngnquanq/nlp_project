name: group10-fairseq
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip<24.1
  - setuptools<70
  - wheel
  - cython
  - numpy<2
  # torch 1.13.1 needs iJIT_NotifyEvent, removed from MKL in 2024.0
  - mkl<2024
  - pytorch=1.13.1
  - pytorch-cuda=11.7
  - pyyaml=6.0.2
  - pip:
      - fairseq==0.12.2
      - sacrebleu==2.6.0
      - pytest==8.4.1
