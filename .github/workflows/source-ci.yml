name: Source CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-eval.txt
      - name: Install source-test dependencies
        run: python -m pip install --requirement requirements-eval.txt
      - name: Run source-only gate
        run: make check-source EVAL_PYTHON=python
